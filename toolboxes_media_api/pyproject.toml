[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "media-api"
version = "0.1.0"
description = "Authenticated image and video generation API for AMD Strix Halo (gfx1151)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The API itself. The inference stack (torch from the ROCm index, diffusers,
# transformers, ...) is the `inference` extra, so tests and the mock backend
# run without it.
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.18",
  "PyYAML>=6.0",
  "pillow>=11.0",
  "numpy>=1.26",
  "av>=14.0",
]

[project.optional-dependencies]
inference = [
  "diffusers==0.40.0",
  "transformers==5.17.0",
  "accelerate>=1.10",
  "peft>=0.17",
  "safetensors>=0.6",
  "gguf>=0.10",
  "huggingface-hub>=1.23,<2",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
media-api = "media_api.__main__:main"
media-api-models = "media_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_api = ["data/*.yaml", "ui/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:torch.*", "ignore::FutureWarning", "ignore:Using `httpx`:DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are fine in tests and for internal invariants
  "RUF001", # the UI and docs use typographic characters on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "E731"]
# importorskip has to run before the torch/diffusers imports
"tests/test_real_adapters.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/media_api"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# Their inline types are partial (lazy modules, runtime-built pipelines); the
# adapters' contract with them is what tests/test_real_adapters.py checks.
module = ["torch", "torch.*", "diffusers", "diffusers.*", "transformers", "transformers.*", "accelerate.*", "safetensors", "safetensors.*", "huggingface_hub", "huggingface_hub.*", "av", "av.*", "gguf.*", "peft.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# The adapters talk to libraries without usable stubs; their contract is
# covered by tests/test_real_adapters.py instead.
module = ["media_api.providers.qwen_image", "media_api.providers.minimax_h3", "media_api.providers.loaders", "media_api.providers.quant"]
disallow_untyped_defs = false
