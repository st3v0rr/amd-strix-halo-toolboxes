<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{csrf}}">
<title>Media API — playground</title>
<link rel="icon" type="image/svg+xml" href="/ui/static/favicon.svg">
<link rel="stylesheet" href="/ui/static/style.css">
<script src="/ui/static/app.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <header class="brand">
    <img src="/ui/static/favicon.svg" alt="" width="28" height="28">
    <h1>Media API</h1>
    <span id="backend" class="pill"></span>
  </header>
  <h2>Recent jobs</h2>
  <ul id="recent"></ul>
  <form class="logout" method="post" action="/ui/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button class="ghost" type="submit">Log out</button></form>
</aside>
<main class="workspace">
  <section class="stage" id="job-panel">
    <div class="job-bar">
      <div id="job-status">No job yet.</div>
      <button id="cancel" class="ghost" type="button" disabled>Cancel</button>
    </div>
    <progress id="job-progress" max="1" value="0"></progress>
    <div id="result"></div>
  </section>
  <section class="composer" id="form-panel">
    <nav id="tasks" role="tablist"></nav>
    <form id="gen-form" novalidate>
      <div data-for="images" class="uploads">
        <label>Input images (1–3) <input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
        <div id="images-preview" class="previews"></div>
      </div>
      <div data-for="start" class="uploads">
        <label>Start image <input id="start_image" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <div id="start_image-preview" class="previews"></div>
      </div>
      <div data-for="end" class="uploads">
        <label>End image <input id="end_image" type="file" accept="image/png,image/jpeg,image/webp"></label>
        <div id="end_image-preview" class="previews"></div>
      </div>
      <div data-for="references" class="uploads">
        <label>Reference images (up to 9, referred to as &lt;Picture 1&gt;, … in the prompt) <input id="references" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
        <div id="references-preview" class="previews"></div>
      </div>
      <div class="prompt-box">
        <label class="sr-only" for="prompt">Prompt</label>
        <textarea id="prompt" rows="3" required placeholder="Describe what to generate… (Ctrl+Enter to send)"></textarea>
        <button id="submit" type="submit">Generate</button>
      </div>
      <div class="row toolbar">
        <label>Model <select id="model"></select></label>
        <label>Profile <select id="profile"></select></label>
        <label class="narrow">Format <select id="format"></select></label>
      </div>
      <p id="profile-note" class="note"></p>
      <details class="settings">
        <summary>Settings</summary>
        <label data-for="negative">Negative prompt <textarea id="negative_prompt" rows="2"></textarea></label>
        <div class="row">
          <label>Width <input id="width" type="number" min="64" step="16"></label>
          <label>Height <input id="height" type="number" min="64" step="16"></label>
          <label>Steps <input id="steps" type="number" min="1" max="1000"></label>
          <label data-for="guidance">Guidance <input id="guidance" type="number" min="0" max="30" step="0.1"></label>
          <label>Seed <input id="seed" type="number" min="0" placeholder="random"></label>
        </div>
        <div class="row" data-for="video">
          <label>Duration (s) <input id="duration" type="number" min="1" max="60" step="0.5"></label>
          <label>FPS <input id="fps" type="number" min="1" max="120"></label>
          <label class="check"><input id="audio" type="checkbox" checked> Audio</label>
        </div>
      </details>
      <p id="form-error" class="error" role="alert"></p>
    </form>
  </section>
</main>
</body>
</html>
