# Built-in model registry. Paths are relative to MEDIA_MODELS_DIR, which keeps
# single-file weights by role (diffusion_models/, text_encoders/, loras/), so
# an existing tree in that layout can be mounted read-only and its files
# reused. The diffusers/ subtree holds the configs, tokenizers, schedulers and VAEs the
# single files need, plus MiniMax-H3's own weights.
#
# Every repo is pinned to the revision whose safetensors headers were checked
# against the loaders (see README "Compatibility"). Only profiles that run are
# listed; the formats that were rejected are documented in the README.
#
# estimated_memory_gb is the unified memory a job needs with that profile
# resident (weights + activations at the default size); the admission check
# compares it with what the box has free before loading anything.

models:
  - id: qwen-image-2512
    label: Qwen-Image-2512
    provider: qwen-image
    license: Apache-2.0
    description: Text-to-image, 20B MMDiT with a Qwen2.5-VL-7B text encoder.
    tasks: [text-to-image]
    default_profile: fp8
    base:
      path: diffusers/Qwen-Image-2512
      repo: Qwen/Qwen-Image-2512
      revision: 25468b98e3276ca6700de15c6628e51b7de54a26
      include: [model_index.json, scheduler/*, tokenizer/*, vae/*, transformer/config.json, text_encoder/config.json]
    constraints:
      size_multiple: 16
      min_side: 256
      max_side: 2048
      max_pixels: 4194304
      guidance: true
      negative_prompt: true
    defaults:
      width: 1328
      height: 1328
      steps: 20
      guidance: 2.5
      # Qwen's own negative prompt for 2512 (from ModelTC/Qwen-Image-Lightning).
      negative_prompt: "低分辨率，低画质，肢体畸形，手指畸形，画面过饱和，蜡像感，人脸无细节，过度光滑，画面具有AI感。构图混乱。文字模糊，扭曲。"
    profiles:
      - id: fp8
        label: FP8 E4M3FN (recommended)
        estimated_memory_gb: 36
        description: >
          Comfy-Org's FP8 E4M3FN transformer kept in FP8 and computed in BF16, the FP8-scaled
          Qwen2.5-VL text encoder kept in FP8 with its per-tensor scales, BF16 VAE.
        components:
          transformer:
            format: comfy-single-file
            storage: fp8
            file:
              path: diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
              repo: Comfy-Org/Qwen-Image_ComfyUI
              filename: split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
              revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
          text_encoder: &qwen_te_fp8
            format: comfy-qwen2.5-vl
            storage: fp8
            file:
              path: text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
              repo: Comfy-Org/Qwen-Image_ComfyUI
              filename: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
              revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
          vae: &qwen_vae
            format: diffusers
            subfolder: vae
            storage: bf16
      - id: bf16
        label: BF16 (quality, opt-in)
        estimated_memory_gb: 64
        description: >
          Full BF16 transformer and text encoder. About twice the peak memory of fp8 — only
          worth it when nothing else needs the unified memory.
        components:
          transformer:
            format: comfy-single-file
            storage: bf16
            file:
              path: diffusion_models/qwen_image_2512_bf16.safetensors
              repo: Comfy-Org/Qwen-Image_ComfyUI
              filename: split_files/diffusion_models/qwen_image_2512_bf16.safetensors
              revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
          text_encoder: &qwen_te_bf16
            format: comfy-qwen2.5-vl
            storage: bf16
            file:
              path: text_encoders/qwen_2.5_vl_7b.safetensors
              repo: Comfy-Org/Qwen-Image_ComfyUI
              filename: split_files/text_encoders/qwen_2.5_vl_7b.safetensors
              revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
          vae: *qwen_vae
      - id: lightning-4step
        label: Lightning 4-step (fast)
        estimated_memory_gb: 36
        description: >
          The fp8 profile with lightx2v's Qwen-Image-2512 Lightning 4-step LoRA fused in
          (the text-to-image LoRA, never the Edit one), 4 steps without CFG.
        scheduler: lightning
        defaults: {steps: 4, guidance: 1.0}
        lora:
          base_model: qwen-image-2512
          scale: 1.0
          file:
            path: loras/Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors
            repo: lightx2v/Qwen-Image-2512-Lightning
            filename: Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors
            revision: a52649c9d0f6e1a248bff13f0df33bb8a2abdb52
        components:
          transformer:
            format: comfy-single-file
            storage: fp8
            file:
              path: diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
              repo: Comfy-Org/Qwen-Image_ComfyUI
              filename: split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
              revision: 1f12b17be14c89b026c51a91d67c32f84bb047bc
          text_encoder: *qwen_te_fp8
          vae: *qwen_vae

  - id: qwen-image-edit-2511
    label: Qwen-Image-Edit-2511
    provider: qwen-image-edit
    license: Apache-2.0
    description: Instruction image editing from one to three input images.
    tasks: [image-edit]
    default_profile: fp8mixed
    base:
      path: diffusers/Qwen-Image-Edit-2511
      repo: Qwen/Qwen-Image-Edit-2511
      revision: 6f3ccc0b56e431dc6a0c2b2039706d7d26f22cb9
      include: [model_index.json, scheduler/*, tokenizer/*, processor/*, vae/*, transformer/config.json, text_encoder/config.json]
    constraints:
      size_multiple: 16
      min_side: 256
      max_side: 2048
      max_pixels: 4194304
      guidance: true
      negative_prompt: true
      max_input_images: 3
    defaults:
      steps: 20
      guidance: 4.0
      negative_prompt: " "
    profiles:
      - id: fp8mixed
        label: FP8 mixed (recommended)
        estimated_memory_gb: 36
        description: >
          Comfy-Org's fp8mixed transformer kept in FP8 with its per-tensor scales (the layers it
          stores in BF16 stay BF16), the shared FP8-scaled text encoder, BF16 VAE.
        components:
          transformer:
            format: comfy-scaled-fp8
            storage: fp8
            file:
              path: diffusion_models/qwen_image_edit_2511_fp8mixed.safetensors
              repo: Comfy-Org/Qwen-Image-Edit_ComfyUI
              filename: split_files/diffusion_models/qwen_image_edit_2511_fp8mixed.safetensors
              revision: f68ace85e60b4a02a323e394253731947657b7d2
          text_encoder: *qwen_te_fp8
          vae: *qwen_vae
      - id: bf16
        label: BF16 (quality, opt-in)
        estimated_memory_gb: 64
        description: Full BF16 transformer and text encoder; about twice the peak memory of fp8mixed.
        components:
          transformer:
            format: comfy-single-file
            storage: bf16
            file:
              path: diffusion_models/qwen_image_edit_2511_bf16.safetensors
              repo: Comfy-Org/Qwen-Image-Edit_ComfyUI
              filename: split_files/diffusion_models/qwen_image_edit_2511_bf16.safetensors
              revision: f68ace85e60b4a02a323e394253731947657b7d2
          text_encoder: *qwen_te_bf16
          vae: *qwen_vae
      - id: lightning-4step
        label: Lightning 4-step (fast)
        estimated_memory_gb: 36
        description: >
          fp8mixed with the dedicated Qwen-Image-Edit-2511 Lightning 4-step LoRA fused in, 4 steps
          without CFG.
        scheduler: lightning
        defaults: {steps: 4, guidance: 1.0}
        lora:
          base_model: qwen-image-edit-2511
          scale: 1.0
          file:
            path: loras/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
            repo: lightx2v/Qwen-Image-Edit-2511-Lightning
            filename: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
            revision: d74eba145674fd7e31b949324e148e21e7118abd
        components:
          transformer:
            format: comfy-scaled-fp8
            storage: fp8
            file:
              path: diffusion_models/qwen_image_edit_2511_fp8mixed.safetensors
              repo: Comfy-Org/Qwen-Image-Edit_ComfyUI
              filename: split_files/diffusion_models/qwen_image_edit_2511_fp8mixed.safetensors
              revision: f68ace85e60b4a02a323e394253731947657b7d2
          text_encoder: *qwen_te_fp8
          vae: *qwen_vae

  - id: qwen-image-2.1
    label: Qwen-Image-2.1
    provider: qwen-image-21
    license: Qwen Research License Agreement (research use, not commercial; read it before use)
    description: >
      Text-to-image and image editing in one model: a 7B single-stream DiT with a Qwen3-VL-8B
      text encoder. Draws RGBA (transparent backgrounds) and edits from up to ten input images.
      Sampled without CFG by default.
    tasks: [text-to-image, image-edit]
    default_profile: bf16
    base:
      path: diffusers/Qwen-Image-2.1
      repo: Qwen/Qwen-Image-2.1
      revision: d26bb61231c349cf6b7896fa83353113880e1ba3
      include: [model_index.json, scheduler/*, processor/*, vae/*, transformer/config.json, text_encoder/config.json, text_encoder/generation_config.json]
    constraints:
      # The VAE compresses 16x and the transformer takes 2x2 latent groups.
      size_multiple: 32
      min_side: 256
      # Qwen's own aspect-ratio table goes up to 2752 x 1536; MEDIA_MAX_WIDTH /
      # MEDIA_MAX_HEIGHT (2048 by default) cap it below that.
      max_side: 2752
      max_pixels: 4227072
      guidance: true
      negative_prompt: true
      max_input_images: 10
    defaults:
      width: 2048
      height: 2048
      steps: 40
      guidance: 1.0
    profiles:
      - id: bf16
        label: BF16 (recommended)
        estimated_memory_gb: 48
        description: >
          Comfy-Org's BF16 transformer (its fused gate/up projections split on load) and BF16
          Qwen3-VL-8B text encoder, VAE from the official repository. 40 steps without CFG.
        components:
          transformer: &q21_transformer
            format: comfy-single-file
            storage: bf16
            file:
              path: diffusion_models/qwen_image_2.1_bf16.safetensors
              repo: Comfy-Org/Qwen-Image-2.1
              filename: diffusion_models/qwen_image_2.1_bf16.safetensors
              revision: aacf31a6d48e707f352ecba714cee0680da3479b
          text_encoder: &q21_te
            format: comfy-qwen3-vl
            storage: bf16
            file:
              path: text_encoders/qwen3vl_8b_bf16.safetensors
              repo: Comfy-Org/Qwen-Image-2.1
              filename: text_encoders/qwen3vl_8b_bf16.safetensors
              revision: aacf31a6d48e707f352ecba714cee0680da3479b
          vae: &q21_vae
            format: diffusers
            subfolder: vae
            storage: bf16
      - id: turbo-8step
        label: Turbo, 8 steps (fast)
        estimated_memory_gb: 48
        description: >
          The bf16 profile with the Turbo LoRA fused in (Comfy-Org's extraction of
          Qwen-Image-2.1-Turbo), sampled on Turbo's own eight sigmas without CFG.
        scheduler: fixed-sigmas
        # Qwen/Qwen-Image-2.1-Turbo model_index.json, sample_sigmas.
        sigmas: [1.0, 0.978453, 0.95418, 0.926626, 0.89508, 0.845148, 0.704534, 0.414568]
        defaults: {steps: 8, guidance: 1.0}
        lora:
          base_model: qwen-image-2.1
          scale: 1.0
          file:
            path: loras/qwen_image_2.1_turbo_lora_avg_rank_178_bf16.safetensors
            repo: Comfy-Org/Qwen-Image-2.1
            filename: loras/qwen_image_2.1_turbo_lora_avg_rank_178_bf16.safetensors
            revision: aacf31a6d48e707f352ecba714cee0680da3479b
        components:
          transformer: *q21_transformer
          text_encoder: *q21_te
          vae: *q21_vae
      - id: lightning-4step
        label: Lightning 4-step (fastest)
        estimated_memory_gb: 48
        description: >
          The bf16 profile with lightx2v's Qwen-Image-2.1 Lightning v2-RL 4-step LoRA (rank 64)
          fused in, sampled on its four released sigmas without CFG. Text-to-image and edit.
        scheduler: fixed-sigmas
        # lightx2v/Qwen-Image-2.1-Lightning-v2-RL inference_config.json, sample_sigmas.
        sigmas: [1.0, 0.95418, 0.89508, 0.704534]
        defaults: {steps: 4, guidance: 1.0}
        lora:
          base_model: qwen-image-2.1
          scale: 1.0
          file:
            path: loras/qwen_image_21_lightning_v2_rl_4steps_lora_rank64.safetensors
            repo: lightx2v/Qwen-Image-2.1-Lightning-v2-RL
            filename: qwen_image_21_lightning_v2_rl_4steps_lora_rank64.safetensors
            revision: 682b2529ffb5ae9ba39ceb81a31ce99e602da2ee
        components:
          transformer: *q21_transformer
          text_encoder: *q21_te
          vae: *q21_vae

  - id: minimax-h3
    label: MiniMax-H3
    provider: minimax-h3
    license: MiniMax H3 Community License (read it before use; some regions need an application)
    description: >
      Joint video + stereo audio, 33B DiT with a Qwen3-VL-32B conditioner. 24 fps, 5-15 s,
      768-pixel short edge. Guidance-distilled: no CFG, no negative prompt.
    tasks: [text-to-video, image-to-video, start-end-to-video, reference-to-video]
    default_profile: int8
    base:
      path: diffusers/MiniMax-H3
      repo: MiniMaxAI/MiniMax-H3
      revision: 42ed227ee7df40d41602854ae760620d6eb651fe
      include: [modular_model_index.json, scheduler/*, audio_scheduler/*, tokenizer/*, processor/*]
    constraints:
      size_multiple: 32
      min_side: 256
      max_side: 2048
      max_pixels: 1032192
      min_aspect: 0.25
      max_aspect: 4.0
      fps: [24]
      frame_grid: [17, 5]
      min_frames: 124
      max_frames: 345
      guidance: false
      negative_prompt: false
      audio: true
      max_reference_images: 9
    defaults:
      width: 1344
      height: 768
      steps: 20
      fps: 24
      duration_seconds: 5
    profiles:
      - id: int8
        label: INT8 weight-only (recommended)
        estimated_memory_gb: 86
        description: >
          The official BF16 diffusers weights, quantized to INT8 per output row while they stream
          from disk (transformer and Qwen3-VL conditioner; the embedders, token refiner, norms
          and output projections stay BF16) and dequantized per forward in plain PyTorch. Video
          VAE in BF16, audio VAE in FP32.
        components:
          transformer: &h3_transformer
            format: diffusers
            subfolder: transformer
            storage: int8
            options:
              exclude: [proj_in, audio_proj_in, context_embedder, time_embedder, time_proj, token_refiner, norm_out, proj_out, audio_proj_out]
          transformer_ref: &h3_transformer_ref
            format: diffusers
            subfolder: transformer_ref
            storage: int8
            options:
              exclude: [proj_in, audio_proj_in, context_embedder, time_embedder, time_proj, token_refiner, norm_out, proj_out, audio_proj_out]
          text_encoder: &h3_text_encoder
            format: diffusers
            subfolder: text_encoder
            storage: int8
            options:
              exclude: [model.visual, model.language_model.embed_tokens, model.language_model.norm, lm_head]
          vae: &h3_vae
            format: diffusers
            subfolder: vae
            storage: bf16
          audio_vae: &h3_audio_vae
            format: diffusers
            subfolder: audio_vae
            storage: fp32
      - id: turbo
        label: Turbo LoRA, 6 steps (fast)
        estimated_memory_gb: 86
        description: >
          The int8 profile with larryvrh's MiniMax-H3 Turbo LoRA (v4 step600 EMA) fused into the
          BF16 weights before quantization. Trained on the fl2va partition, so reference-to-video
          is not offered here.
        tasks: [text-to-video, image-to-video, start-end-to-video]
        defaults: {steps: 6}
        lora:
          base_model: minimax-h3
          scale: 1.0
          file:
            path: loras/minimax_h3_turbo_v4_step600_ema.safetensors
            repo: larryvrh/MiniMax-H3-Turbo-Lora
            filename: minimax_h3_turbo_v4_step600_ema.safetensors
            revision: 43a74557ac3f6539db8e0f2a959d03feb7a81480
        components:
          transformer: *h3_transformer
          text_encoder: *h3_text_encoder
          vae: *h3_vae
          audio_vae: *h3_audio_vae

  # Speech-to-text. These run on transformers alone (no diffusers) and live in
  # MEDIA_MODELS_DIR/speech/, one directory per repository as it ships. Audio is
  # decoded to 16 kHz mono on upload, cut at pauses into windows of at most
  # window_seconds, and windows that are silence throughout are skipped (Whisper
  # invents text for silence); all timestamps are seconds from the start.
  - id: whisper-large-v3-turbo
    label: Whisper large-v3-turbo
    provider: whisper
    license: MIT
    description: >
      Speech-to-text in 100 languages with segment timestamps. large-v3 with a 4-layer decoder
      (809M parameters): close to large-v3 in quality, several times faster.
    tasks: [speech-to-text]
    default_profile: bf16
    base:
      path: speech/whisper-large-v3-turbo
      repo: openai/whisper-large-v3-turbo
      revision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
      include: [config.json, generation_config.json, model.safetensors, preprocessor_config.json, tokenizer.json, tokenizer_config.json, vocab.json, merges.txt, normalizer.json, added_tokens.json, special_tokens_map.json]
    constraints:
      window_seconds: 30
      word_timestamps: false
      languages: [en, zh, de, es, ru, ko, fr, ja, pt, tr, pl, ca, nl, ar, sv, it, id, hi, fi, vi, he, uk, el, ms, cs, ro, da, hu, ta, no, th, ur, hr, bg, lt, la, mi, ml, cy, sk, te, fa, lv, bn, sr, az, sl, kn, et, mk, br, eu, is, hy, ne, mn, bs, kk, sq, sw, gl, mr, pa, si, km, sn, yo, so, af, oc, ka, be, tg, sd, gu, am, yi, lo, uz, fo, ht, ps, tk, nn, mt, sa, lb, my, bo, tl, mg, as, tt, haw, ln, ha, ba, jw, su, yue]
    defaults:
      batch_size: 8
    profiles:
      - id: bf16
        label: BF16
        estimated_memory_gb: 4
        description: The official weights in BF16, eight 30-second windows per batch.
        components:
          model:
            format: transformers
            storage: bf16

  - id: qwen3-asr-1.7b
    label: Qwen3-ASR 1.7B
    provider: qwen3-asr
    license: Apache-2.0
    description: >
      Speech-to-text in 30 languages and 22 Chinese dialects, with word and sentence timestamps
      from Qwen3-ForcedAligner (for de, en, es, fr, it, ja, ko, pt, ru, zh, yue; other languages
      get one segment per window). The prompt biases it towards names and terms.
    tasks: [speech-to-text]
    default_profile: bf16
    base:
      path: speech/Qwen3-ASR-1.7B
      repo: Qwen/Qwen3-ASR-1.7B-hf
      revision: bcd2b5b7f32b480ab5790554cfa8347f246a14f3
      include: [config.json, generation_config.json, model.safetensors, processor_config.json, tokenizer.json, tokenizer_config.json, chat_template.jinja]
    constraints:
      window_seconds: 30
      word_timestamps: true
      languages: [ar, yue, zh, cs, da, nl, en, fil, fi, fr, de, el, hi, hu, id, it, ja, ko, mk, ms, fa, pl, pt, ro, ru, es, sv, th, tr, vi]
      aligned_languages: [yue, zh, en, fr, de, it, ja, ko, pt, ru, es]
    defaults:
      batch_size: 4
    profiles:
      - id: bf16
        label: BF16 with forced aligner
        estimated_memory_gb: 12
        description: >
          The official transformers weights in BF16, plus Qwen3-ForcedAligner-0.6B in BF16 for
          the timestamps. Four 30-second windows per batch.
        components:
          model:
            format: transformers
            storage: bf16
          aligner:
            format: transformers
            storage: bf16
            file:
              path: speech/Qwen3-ForcedAligner-0.6B
              repo: Qwen/Qwen3-ForcedAligner-0.6B-hf
              revision: c07281df297b9905d24a508279258cccf987a064
              include: [config.json, model.safetensors, processor_config.json, tokenizer.json, tokenizer_config.json, chat_template.jinja]

  # Speaker diarization, for transcriptions with `diarize: true` (no endpoint of
  # its own). Runs once over the whole track beside the ASR model.
  - id: nemotron-3-diarization
    label: Nemotron-3-Diarization
    provider: nemotron-diarization
    license: OpenMDW-1.1 (commercial use allowed)
    description: >
      NVIDIA's speaker diarization (Sortformer, ~100M parameters): who speaks when, up to eight
      speakers numbered in order of appearance, kept across hours by its speaker cache.
    tasks: [speaker-diarization]
    default_profile: fp32
    base:
      path: speech/Nemotron-3-Diarization
      repo: nvidia/Nemotron-3-Diarization
      revision: f667ed73aee57d40cc39428eb768b4fd87a0a29e
      include: [config.json, processor_config.json, model.safetensors]
    constraints:
      max_speakers: 8
    profiles:
      - id: fp32
        label: FP32 (as released)
        estimated_memory_gb: 2
        description: The released FP32 weights (0.4 GB), offline mode over the whole recording.
        components:
          model:
            format: transformers
            storage: fp32
