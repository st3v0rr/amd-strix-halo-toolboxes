name: Poll ComfyUI Toolbox & Trigger Build

# Watches kyuz0/amd-strix-halo-comfyui-toolboxes, whose scripts/ and workflows/
# are the build context our Dockerfile copies from — so a new commit there is
# what this fork has to rebuild on.
#
# Daily rather than every four hours: the build installs a full ROCm torch and
# clones five repositories, so it is expensive and upstream moves slowly.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  poll-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - id: fetch
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/kyuz0/amd-strix-halo-comfyui-toolboxes.git"
          DEFAULT_REF=$(git ls-remote --symref "$REPO_URL" HEAD | awk '/^ref:/ {print $2}')
          echo "📌 Default branch: ${DEFAULT_REF#refs/heads/}"
          LATEST_SHA=$(git ls-remote "$REPO_URL" "$DEFAULT_REF" | cut -f1)
          if [[ -z "$LATEST_SHA" ]]; then echo "❌ No SHA found"; exit 1; fi
          echo "✅ Latest SHA: $LATEST_SHA"
          echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"

      - id: previous
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "🔎 Checking for prior artifact 'last-comfyui-sha'…"
          ART_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GH_REPO}/actions/artifacts?per_page=100" \
            | jq -r '.artifacts | map(select(.name=="last-comfyui-sha" and .expired==false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [[ -n "$ART_ID" ]]; then
            echo "📦 Found artifact id: $ART_ID (downloading)"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -L \
              "https://api.github.com/repos/${GH_REPO}/actions/artifacts/${ART_ID}/zip" -o artifact.zip
            unzip -p artifact.zip source_state > source_state || true
          else
            echo "ℹ️ No prior artifact found"
          fi
          PREV=""
          if [[ -f source_state ]]; then PREV=$(cat source_state); fi
          echo "🕓 Previous SHA: $PREV"
          echo "previous_sha=$PREV" >> "$GITHUB_OUTPUT"

      - id: compare
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.fetch.outputs.latest_sha }}" != "${{ steps.previous.outputs.previous_sha }}" ]]; then
            echo "🔁 New commit detected"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger build_and_publish_comfyui.yml on main
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WF="build_and_publish_comfyui.yml"
          REF="main"
          echo "🚀 Dispatching $WF on $REF…"
          CODE=$(curl -s -o /tmp/resp -w "%{http_code}" \
                 -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -d "{\"ref\":\"$REF\",\"inputs\":{\"source_ref\":\"${{ steps.fetch.outputs.latest_sha }}\",\"source_state_name\":\"last-comfyui-sha\",\"source_state_value\":\"${{ steps.fetch.outputs.latest_sha }}\"}}" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF/dispatches")
          echo "HTTP $CODE"
          if [[ "$CODE" != "204" ]]; then echo "Response:"; cat /tmp/resp; exit 1; fi
