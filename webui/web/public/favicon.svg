<!--
  A die inside a halo, in the app's accent orange (#ff6b35).

  Shapes only, no text: at 16px a letterform turns to mush, while a ring
  around a square stays readable. The dark rounded plate is part of the mark
  rather than a background, so the icon keeps its contrast on a light tab
  strip as well as a dark one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0d1117" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ff6b35" stroke-width="6" />
  <rect x="23" y="23" width="18" height="18" rx="4" fill="#ff6b35" />
</svg>
